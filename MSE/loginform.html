<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseIt | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="logo">EaseIt</div>
        <p class="tagline">Freshness delivered to your doorstep.</p>

        <h2>Welcome Back!</h2>

        <form action="index.html" method="get">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*\W).{8,}"
                    title="Minimum 8 characters, including uppercase, lowercase, number and special character"
                    required
                >
            </div>

            <button type="submit" class="btn login-btn">
                Login
            </button>

        </form>

        <button
            class="btn register-btn"
            onclick="window.location.href='registrationform.html'">
            Create an Account
        </button>

        <p class="footer">
            © 2026 EaseIt Grocery Store
        </p>

    </div>

</body>
</html>
