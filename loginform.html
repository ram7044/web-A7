<!DOCTYPE html>
<html lang="en">
     <head>
         <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>Login Page</title>
    </head>
    <body>
        <h2>Login Form</h2>
        <form action="aboutme.html" method="get">

            <label for="username">Username : </label>
            <input type="text" placeholder="Type your username" id="username" name="username" required>
            <br><br>
            <label for="password">Password : </label>
            <input type="password" id="password" placeholder="Enter your password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*\W).{8,}" title="Min 8 characters, 1 uppercase, 1 lowercase, 1 number, 1 special char" required>
            <br><br>
            <button type="submit">Login</button>
        </form>
    </body>
</html>
