<!DOCTYPE html>
<html lang="en">
    <head>
         <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>Registration Page</title>
    </head>
    <body>
        <h2>Registration Form</h2>
        <form action="loginform.html" method="get" autocomplete="on">
            <label>Name : </label>
            <input type="text" placeholder="Write your name">
            <br><br>
            <label>Email : </label>
            <input type="email" placeholder="Enter your mail">
            <br><br>
            <label>Gender : </label>
            <input type="radio" name="gender" value="male">Male
            <input type="radio" name="gender" value="female">Female
            <br><br>
            <label>Age : </label>
            <input type="number" placeholder="Enter your age">
            <br><br>
            <label>DOB : </label>
            <input type="date">
            <br><br>
            <label>Subjects : </label>
            <input type="checkbox" name="subjects" value="chemistry">Chemistry
            <input type="checkbox" name="subjects" value="DLD">DLD
            <input type="checkbox" name="subjects" value="DSTL">DSTL
            <input type="checkbox" name="subjects" value="CFE">CFE
            <br><br>
            <label>Doc File : </label>
            <input type="file">
            <br><br>
            <label>Password : </label>
            <input type="password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*\W).{8,}" title="Min 8 characters, 1 uppercase, 1 lowercase, 1 number, 1 special char">
            <br><br>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </body>
</html>
